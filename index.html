<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6eaf0; --text:#434d5f; --muted:#8a94a6; --hi:#ffffff; --lo:#c3cad7;
  --a1:#7fe0ee; --a2:#4fb4d6; --a3:#8b7bea; --on:#ffffff;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a2e36;--text:#dde2ec;--muted:#8b94a8;--hi:#353a45;--lo:#1d2026;--a1:#5fd3e6;--a2:#33a3c8;--a3:#8a7cf0;--on:#0e1a1e}
}
:root[data-theme="dark"]{--bg:#2a2e36;--text:#dde2ec;--muted:#8b94a8;--hi:#353a45;--lo:#1d2026;--a1:#5fd3e6;--a2:#33a3c8;--a3:#8a7cf0;--on:#0e1a1e}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{overflow-x:hidden;overscroll-behavior-y:none}
body{
  min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:"Poppins","Noto Sans Sinhala","Noto Sans Tamil",system-ui,sans-serif;
  display:flex;justify-content:center;align-items:center;overflow-x:hidden;
}
.phone{
  position:relative;z-index:1;width:100%;max-width:480px;
  min-height:100dvh;
  padding:calc(22px + env(safe-area-inset-top,0px)) clamp(20px,6vw,32px) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  transition:opacity .3s ease,transform .3s ease;
}
.phone.out{opacity:0;transform:translateX(-28px)}
@media (min-width:900px){
  #s1{max-width:980px;display:grid;grid-template-columns:1fr 1fr;column-gap:72px;align-content:center;padding:40px 48px}
  #s1.out{transform:translateX(-28px)}
  #s1 .top{grid-column:1/-1}
  #s1 .stage{grid-column:1;grid-row:2;width:260px;height:260px}
  #s1 h1{grid-column:1;grid-row:3;font-size:24px}
  #s1 .sub{grid-column:1;grid-row:4;font-size:14px}
  #s1 .options{grid-column:2;grid-row:2/5;align-self:center;margin-top:0}
  #s1 .spacer{display:none}
  #s1 .btn{grid-column:2;grid-row:5;margin-top:30px}
  #s1 .toast{grid-column:2;grid-row:6}
  #s2{max-width:560px}
}

/* shared bits */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wordmark{font-weight:600;font-size:22px;letter-spacing:.3px;
  background:linear-gradient(90deg,var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.tbtn{width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;
  background:var(--bg);color:var(--muted);box-shadow:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);transition:box-shadow .2s,color .2s}
.tbtn:active{box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);color:var(--a2)}
.tbtn:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
.tbtn svg{width:19px;height:19px}
.btn{position:relative;width:100%;border:0;cursor:pointer;padding:17px;border-radius:40px;overflow:hidden;
  font:600 16px "Poppins","Noto Sans Sinhala","Noto Sans Tamil",sans-serif;color:var(--on);
  display:flex;justify-content:center;align-items:center;gap:10px;
  background:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));
  box-shadow:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);transition:box-shadow .2s,transform .2s}
.btn:active{transform:scale(.985);box-shadow:inset 4px 4px 9px rgba(0,0,0,.2),inset -3px -3px 8px rgba(255,255,255,.25)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.toast{margin:14px 0 0;text-align:center;font-size:13px;color:var(--a2);font-weight:500;min-height:20px}
.spacer{flex:1;min-height:24px}
.tick{width:15px;height:15px;stroke:var(--on);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s ease .05s}

/* screen 1 */
.stage{position:relative;width:clamp(130px,min(54vw,25dvh),210px);height:clamp(130px,min(54vw,25dvh),210px);margin:clamp(30px,5dvh,46px) auto clamp(14px,2.5dvh,22px);display:grid;place-items:center;cursor:pointer}
.ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 9px 9px 18px var(--lo),inset -9px -9px 18px var(--hi)}
.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dash{transform-origin:50px 50px;animation:spin 26s linear infinite reverse}
.riders{position:absolute;left:-20%;top:-20%;width:140%;height:140%;pointer-events:none;animation:spin 8s linear infinite}
.w{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.bike{animation:bob .28s ease-in-out infinite alternate}
.puff{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff .9s ease-out infinite}
@keyframes bob{to{transform:translateY(-.6px)}}
@keyframes puff{0%{opacity:.6;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-10px,-4px) scale(1.7)}}
.orb{position:relative;width:70%;height:70%;border-radius:50%;display:grid;place-items:center;text-align:center;padding:12px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:10px 10px 22px var(--lo),-10px -10px 22px var(--hi);animation:float 5s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg);box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.hello{position:relative;z-index:1;font-size:clamp(18px,5.6vw,23px);font-weight:600;line-height:1.3;
  background:linear-gradient(135deg,var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .22s,transform .22s}
.hello.swap{opacity:0;transform:scale(.85)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-6px)}}
h1{margin:14px 0 4px;text-align:center;font-size:19px;font-weight:600;line-height:1.5}
.sub{margin:0;text-align:center;color:var(--muted);font-size:12.5px}
.options{margin:clamp(14px,2.5dvh,24px) 0 0;padding:0;border:0;display:flex;flex-direction:column;gap:clamp(12px,2dvh,18px)}
.opt{position:relative;display:block}
.opt input,.v input,.fp input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.card{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:22px;background:var(--bg);
  box-shadow:7px 7px 15px var(--lo),-7px -7px 15px var(--hi);transition:box-shadow .25s,transform .25s}
.opt:hover .card{transform:translateY(-2px)}
.glyph{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:24px;font-weight:600;color:var(--muted);
  box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);transition:color .25s}
.names{flex:1;display:flex;flex-direction:column;line-height:1.4}
.native{font-size:17px;font-weight:600}
.latin{font-size:12px;color:var(--muted)}
.radio,.vk{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);transition:background .25s,box-shadow .25s}
.opt input:checked + .card{box-shadow:inset 7px 7px 14px var(--lo),inset -7px -7px 14px var(--hi);transform:none}
.opt input:checked + .card .glyph{color:var(--a2)}
.opt input:checked + .card .radio{background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:0 0 12px color-mix(in srgb,var(--a1) 60%,transparent)}
.opt input:checked + .card .tick{stroke-dashoffset:0}
.opt input:focus-visible + .card,.v input:focus-visible + .vc,.fp input:focus-visible + .pill{outline:2px solid var(--a2);outline-offset:3px}

/* screen 2 */
.brand2{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.6px;flex:1;text-align:center}
.step{font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;color:var(--a2);white-space:nowrap;
  box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.prog{height:10px;border-radius:8px;margin-top:18px;overflow:hidden;box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.prog i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--a1),var(--a3));
  box-shadow:0 0 10px color-mix(in srgb,var(--a1) 70%,transparent);animation:fill .9s .35s ease forwards}
@keyframes fill{to{width:66.6%}}
.hero{display:flex;align-items:center;gap:18px;margin:26px 0 4px}
.hbadge{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi)}
.hbadge span{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--a2);background:var(--bg);
  box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.hbadge svg{width:34px;height:34px}
.hbadge span svg{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.55) rotate(-14deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:none}}
h2{margin:0 0 4px;font-size:21px;font-weight:600;line-height:1.4}
.lead{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.lbl{margin:24px 0 12px;font-size:14px;font-weight:600}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.v{position:relative;display:block}
.vc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:20px;background:var(--bg);
  font-size:12px;font-weight:600;text-align:center;line-height:1.35;min-height:112px;
  box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);transition:box-shadow .25s,transform .25s}
.v:hover .vc{transform:translateY(-2px)}
.vi{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);transition:color .25s}
.vi svg{width:30px;height:30px}
.vk{width:22px;height:22px;margin-top:auto}
.vk .tick{width:12px;height:12px}
.v input:checked + .vc{box-shadow:inset 6px 6px 12px var(--lo),inset -6px -6px 12px var(--hi);transform:none}
.v input:checked + .vc .vi{color:var(--a2)}
.v input:checked + .vc .vk{background:linear-gradient(145deg,var(--a1),var(--a2))}
.v input:checked + .vc .tick{stroke-dashoffset:0}
.fld{margin-top:20px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px 6px}
.fld input{width:100%;border:0;padding:15px 20px;border-radius:20px;background:var(--bg);color:var(--text);font-size:14px;font-weight:500;font-family:inherit;outline:none;
  box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);transition:box-shadow .2s}
.fld input::placeholder{color:var(--muted);opacity:.75}
.fld input:focus{box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi),0 0 0 2px var(--a2)}
#num{text-transform:uppercase}#num::placeholder{text-transform:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fp{position:relative;display:block}
.pill{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:18px;background:var(--bg);font-size:14px;font-weight:500;
  box-shadow:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);transition:box-shadow .25s,color .25s}
.pill::before{content:"";width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);transition:background .25s}
.fp input:checked + .pill{box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi);color:var(--a2);font-weight:600}
.fp input:checked + .pill::before{background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:0 0 8px color-mix(in srgb,var(--a1) 70%,transparent)}
.cta{margin-top:30px}

/* screen 3: dashboard */
:root{--y1:#ffe685;--y2:#ffc22e;--ya:#c98a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ya:#ffd25a}}
:root[data-theme="dark"]{--ya:#ffd25a}
#s3{max-width:560px;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand3{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.6px}
.greet{margin:4px 0 0;font-size:20px;font-weight:600;line-height:1.4}
.dbtns{display:flex;gap:12px}
.av{color:var(--ya)}
.vchip{align-self:flex-start;display:flex;align-items:center;gap:10px;margin-top:14px;padding:7px 16px 7px 8px;border-radius:22px;font-size:12.5px;font-weight:600;
  box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ya);background:var(--bg);box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi)}
.ci svg{width:18px;height:18px}
.cn{padding-left:10px;border-left:1.5px solid var(--lo);color:var(--muted);letter-spacing:.4px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding:5px;border-radius:20px;box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:16px;background:var(--bg);
  box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi);transform:translateX(calc(var(--idx,0)*100%));transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:10px 4px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .25s}
.seg button.on{color:var(--text)}
.hero3{position:relative;margin-top:18px;padding:22px 20px;border-radius:28px;overflow:hidden;color:#2d2100;
  background:linear-gradient(135deg,var(--y1),#ffc933 60%,#ffb21e);box-shadow:10px 10px 22px var(--lo),-10px -10px 22px var(--hi)}
.hero3::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.3)}
.hero3::after{content:"";position:absolute;left:-30px;bottom:-64px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18)}
.hr{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nl{font-size:12.5px;font-weight:500;opacity:.8}
.net{font-size:34px;font-weight:600;line-height:1.3;margin:2px 0}
.ns{font-size:11.5px;opacity:.75;line-height:1.5}
.mring{position:relative;width:74px;height:74px;flex:none}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600}
.two,.three{display:grid;gap:14px;margin-top:18px}
.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr);margin-top:0}
.mc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi)}
.mi{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.mi svg{width:18px;height:18px}.mi.up{color:var(--a2)}.mi.dn{color:var(--a3)}
.ml{font-size:11.5px;color:var(--muted)}.mv{font-size:15px;font-weight:600;line-height:1.5}
.sh{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px;font-size:16px;font-weight:600}
.rc{font-size:11.5px;font-weight:500;color:var(--muted)}
.fi{color:var(--muted)}.fi svg{width:20px;height:20px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch{border:0;cursor:pointer;padding:9px 16px;border-radius:18px;background:var(--bg);color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;
  box-shadow:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);transition:box-shadow .25s,color .25s}
.ch.on{box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);color:var(--text);font-weight:600}
.ch.on::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--y2);box-shadow:0 0 8px var(--y2)}
.stat{padding:16px 6px;border-radius:22px;text-align:center;box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi)}
.stat span[data-ic]{display:inline-grid;color:var(--ya)}.stat svg{width:22px;height:22px}
.sv{font-size:20px;font-weight:600;margin-top:6px}.sl{font-size:12px;color:var(--muted)}
.ecard{padding:20px 18px;border-radius:26px;box-shadow:7px 7px 14px var(--lo),-7px -7px 14px var(--hi)}
.er{margin-bottom:18px}.er:last-child{margin-bottom:0}
.erh{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:9px}
.erh b{font-weight:600}
.tr{height:10px;border-radius:6px;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.tr i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qb{border:0;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;padding:15px 8px;border-radius:26px;background:var(--bg);color:var(--text);
  font-family:inherit;font-size:13.5px;font-weight:600;box-shadow:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);transition:box-shadow .2s,transform .2s}
.qb:active{transform:scale(.98);box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.qb.p{background:linear-gradient(135deg,var(--y1),var(--y2));color:#2d2100;box-shadow:0 8px 18px rgba(255,184,0,.35),5px 5px 10px var(--lo),-5px -5px 10px var(--hi)}
.qb svg{width:18px;height:18px}.qb span[data-ic]{display:grid}
.ins{display:flex;gap:14px;margin-top:20px;padding:18px;border-radius:24px;box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.bi{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#2d2100;background:linear-gradient(135deg,var(--y1),var(--y2));box-shadow:0 0 14px rgba(255,194,46,.5)}
.bi svg{width:20px;height:20px}
.it{font-size:14.5px;font-weight:600;margin-bottom:4px}
.ins p{margin:0;font-size:12.5px;line-height:1.65;color:var(--muted)}
.ins p.if{margin-top:8px;color:var(--ya);font-weight:600}
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(calc(100% - 28px),440px);
  display:grid;grid-template-columns:1fr 1fr 82px 1fr 1fr;align-items:center;padding:10px 6px;border-radius:32px;background:var(--bg);
  box-shadow:8px 8px 20px var(--lo),-8px -8px 20px var(--hi)}
.nb{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;font-size:10.5px;font-weight:500;padding:4px 2px;cursor:pointer}
.ni{width:44px;height:34px;border-radius:15px;display:grid;place-items:center;transition:box-shadow .25s,color .25s}
.ni svg{width:21px;height:21px}
.nb.on{color:var(--text);font-weight:600}
.nb.on .ni{color:var(--ya);box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
.fc{position:relative;display:grid;place-items:center}
.fab{width:62px;height:62px;margin-top:-38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#2d2100;
  background:linear-gradient(145deg,var(--y1),var(--y2));box-shadow:0 12px 24px rgba(255,184,0,.45),5px 5px 10px var(--lo),-5px -5px 10px var(--hi);
  border:5px solid var(--bg);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.fab svg{width:26px;height:26px;stroke-width:2.4}
.fab.open{transform:rotate(135deg)}
.fam{position:absolute;bottom:62px;left:50%;display:flex;gap:12px;opacity:0;pointer-events:none;white-space:nowrap;transform:translateX(-50%) translateY(14px) scale(.9);transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1)}
.fam.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.fam .qb{padding:12px 16px;border-radius:22px;font-size:12.5px}
.ftoast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateX(-50%) translateY(14px);opacity:0;pointer-events:none;
  padding:11px 20px;border-radius:20px;background:var(--bg);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;
  box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);transition:opacity .25s,transform .25s}
.ftoast.show{opacity:1;transform:translateX(-50%)}

.in{opacity:0;transform:translateY(16px);animation:in .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*80ms)}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.in{opacity:1;transform:none}.prog i{width:66.6%}}

<body>

<!-- Screen 1: language -->
<main class="phone" id="s1">
  <div class="top in" style="--i:0">
    <span class="wordmark">bite</span>
    <button class="tbtn" id="theme" type="button" aria-label="Toggle dark mode">

        <circle class="puff" cx="-10.5" cy="-1.4" r="1.3" style="fill:var(--muted);animation-delay:.6s"/>

          <g class="w"><circle cx="6.4" cy="0" r="3.3" stroke-width="1.7"/><path d="M6.4-2.6V2.6M3.8 0H9" stroke-width=".5"/></g>
          <path d="M-8.2-4.4L-2.6-5.2" stroke-width="1.5"/>
          <path d="M6.4 0L4.9-6.3L3.9-8.5H2.6" stroke-width="1"/>
          <path d="M-3.2-1.2L-8.6-1.6" stroke-width="1"/>
          <path d="M-2.6-5.4L-1.4-9.6" stroke-width="1.9"/>
          <path d="M-1.4-9.2L2.8-8.4M-2.4-5L1-3.4L1-1" stroke-width=".9"/>
        </g>
        <path d="M-8.4-3.9L-2.8-4.7L-.5-6.9L3.9-6.7L4.9-4.3L5.5-1.4L1-1L-3.2-1.4L-6.6-1.6Z" style="fill:var(--a2)"/>
        <circle cx="-.2" cy="-2.2" r="1.4" style="fill:var(--text)" fill-opacity=".75"/>

      </g></g>
    </svg>

      <span class="card"><span class="glyph" aria-hidden="true">Aa</span>

  <button class="btn in" style="--i:6" id="go" type="button"><span data-t="btn">Continue</span></button>

<!-- Screen 2: vehicle setup -->
<main class="phone" id="s2" hidden>
  <div class="top in" style="--i:0">
    <button class="tbtn" id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="brand2" data-t="brand">DRIVER WALLET</span>
    <span class="step" data-t="step">Step 2 of 3</span>
  </div>
  <div class="prog in" style="--i:1"><i></i></div>

  <div class="hero in" style="--i:2">
    <div class="hbadge" aria-hidden="true"><span id="heroIcon"></span></div>
    <div><h2 data-t="welcome">Welcome aboard!</h2><p class="lead" data-t="lead">Let's set up your vehicle to calculate your earnings and expenses accurately.</p></div>
  </div>

  <div class="fld in" style="--i:5"><label for="num" data-t="numL">Vehicle number (optional)</label><input id="num" type="text" autocomplete="off"></div>

  <div class="lbl in" style="--i:6" data-t="fuel">Fuel type</div>

    <label class="fp"><input type="radio" name="fuel" value="hybrid"><span class="pill" data-t="f_hybrid">Hybrid</span></label>
  </div>

</main>

  </div>

    <div class="er"><div class="erh"><span data-t="otherL"></span><b id="other">Rs. 0</b></div><div class="tr"><i id="bOther" style="background:linear-gradient(90deg,var(--a3),var(--a2))"></i></div></div>
  </div>

  <div class="qa in" style="--i:7">
    <button class="qb p" id="qTrip" type="button"><span data-ic="plus"></span><span data-t="addTrip"></span></button>
    <button class="qb" id="qExp" type="button"><span data-ic="receipt"></span><span data-t="addExp"></span></button>
  </div>

    <div><div class="it" data-t="ins_t"></div><p data-t="ins_b"></p><p class="if" id="insF"></p></div></div>

        <button class="qb" id="mExp" type="button"><span data-ic="receipt"></span><span data-t="addExp"></span></button>

    </div>
    <button class="nb" type="button" data-soon><span class="ni" data-ic="chart"></span><span data-t="n_reports">Reports</span></button>
    <button class="nb" type="button" data-soon><span class="ni" data-ic="gear"></span><span data-t="n_set">Settings</span></button>
  </nav>
  <div class="ftoast" id="ft" role="status"></div>
</main>

 moto:'<circle cx="6" cy="16.5" r="3"/><circle cx="18" cy="16.5" r="3"/><path d="M6 16.5l3.5-6h4l2.5 6M13.5 10.5l-1-3h3M9.5 10.5H7"/>',
 tuk:'<path d="M3.5 16V9.5L7 5.5h8l3.5 4V16M3.5 11.5h15"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>',

};
const svg=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const $=id=>document.getElementById(id);
let cur="en",veh="tuk",bt;

["moto","tuk","car","van","other"].forEach(k=>{
  $("vgrid").insertAdjacentHTML("beforeend",
    '<label class="v"><input type="radio" name="veh" value="'+k+'"'+(k===veh?" checked":"")+'><span class="vc"><span class="vi">'+svg(IC[k])+
    '</span><span data-t="v_'+k+'"></span><span class="vk"><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span></label>');
});

function placeholders(){
  const e=T[cur].ex;
  $("name").placeholder=e+SAMPLE[veh];
  $("num").placeholder=e+"ABC-1234";
}
function hero(){$("heroIcon").innerHTML=svg(IC[veh])}
function apply(code,animate){
  cur=code;const t=T[code];
  document.documentElement.lang=code;
  const h=$("hello");
  const set=()=>{h.textContent=t.hello;h.classList.remove("swap")};
  if(animate){h.classList.add("swap");setTimeout(set,220)}else set();
  document.querySelectorAll("[data-t]").forEach(e=>{if(t[e.dataset.t]!==undefined)e.textContent=t[e.dataset.t]});
  $("back").setAttribute("aria-label",t.back);
  $("toast2").textContent="";
  placeholders();
  try{localStorage.setItem("lang",code)}catch(e){}
}

function rate(x){document.querySelectorAll(".riders,.w,.dash").forEach(e=>e.getAnimations().forEach(a=>{if(a.updatePlaybackRate)a.updatePlaybackRate(x)}))}
function boost(){
  const h=$("hello");
  rate(3);h.classList.add("swap");
  setTimeout(()=>{h.textContent=H[cur];h.classList.remove("swap")},200);
  clearTimeout(bt);
  bt=setTimeout(()=>{rate(1);h.classList.add("swap");setTimeout(()=>{h.textContent=T[cur].hello;h.classList.remove("swap")},200)},1500);
}
document.querySelector(".stage").addEventListener("click",boost);
document.querySelectorAll('input[name="lang"]').forEach(r=>r.addEventListener("change",()=>{
  apply(r.value,true);rate(3);clearTimeout(bt);bt=setTimeout(()=>rate(1),1000)}));
document.querySelectorAll('input[name="veh"]').forEach(r=>r.addEventListener("change",()=>{veh=r.value;hero();placeholders()}));

let scr=1;
function show(n){
  const from=$("s"+scr),to=$("s"+n);scr=n;
  from.classList.add("out");
  setTimeout(()=>{from.hidden=true;from.classList.remove("out");to.hidden=false;window.scrollTo(0,0);if(n===1)rate(1);if(n===3){shown={};setTimeout(()=>render(true),80)}},300);
}
function ripple(e){
  const b=e.currentTarget,r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2;
  const d=document.createElement("span");d.className="rip";
  d.style.cssText="width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";
  b.appendChild(d);setTimeout(()=>d.remove(),650);
}
$("go").addEventListener("click",e=>{ripple(e);setTimeout(()=>show(2),180)});
$("back").addEventListener("click",()=>show(1));
$("save").addEventListener("click",e=>{ripple(e);$("toast2").textContent=T[cur].saved;setTimeout(()=>show(3),550)});
$("theme").addEventListener("click",()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
});

const I2={
 home:'<path d="M4 11l8-6.5 8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/>',

document.querySelectorAll("[data-ic]").forEach(e=>e.innerHTML=svg(I2[e.dataset.ic]));

const BASE={gross:8500,fees:1120,fuel:1900,other:620,trips:17,km:128};
let per=0,plat=0,shown={},fto;
const fmtR=n=>"Rs. "+Math.round(n).toLocaleString("en-US");
const fmtN=n=>Math.round(n).toLocaleString("en-US");
const fmtP=n=>Math.round(n)+"%";
function calc(){
  const f=[1,6.2,26.5][per]*[1,.6,.4][plat];
  const g=BASE.gross*f,fe=BASE.fees*f,fu=BASE.fuel*f,o=BASE.other*f,c=fe+fu+o,n=g-c;
  return{gross:g,costs:c,net:n,fees:fe,fuel:fu,other:o,trips:Math.max(1,Math.round(BASE.trips*f)),km:Math.round(BASE.km*f),margin:g?Math.round(n/g*100):0};
}
function tween(id,to,f,anim){
  const el=$(id),from=shown[id]||0;shown[id]=to;
  const k=el._k=(el._k||0)+1;
  if(!anim||matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=f(to);return}
  const t0=performance.now();
  (function step(t){
    if(el._k!==k)return;
    const p=Math.min(1,(t-t0)/650),e=1-Math.pow(1-p,3);
    el.textContent=f(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function render(anim){
  const v=calc(),t=T[cur];
  tween("net",v.net,fmtR,anim);tween("gross",v.gross,fmtR,anim);tween("costs",v.costs,fmtR,anim);
  tween("fees",v.fees,fmtR,anim);tween("fuelv",v.fuel,fmtR,anim);tween("other",v.other,fmtR,anim);
  tween("trips",v.trips,fmtN,anim);tween("km",v.km,fmtN,anim);tween("margin",v.margin,fmtP,anim);tween("mpct",v.margin,fmtP,anim);
  const m=Math.max(v.fees,v.fuel,v.other)||1;
  $("bFees").style.width=v.fees/m*100+"%";$("bFuel").style.width=v.fuel/m*100+"%";$("bOther").style.width=v.other/m*100+"%";
  $("mArc").style.strokeDashoffset=188.5*(1-Math.max(0,Math.min(100,v.margin))/100);
  const h=new Date().getHours();
  $("greet").textContent=t[h<12?"g_m":h<17?"g_a":"g_e"];
  $("insF").textContent=t.ins_f.replace("{p}",Math.round(v.fuel/v.costs*100));
  $("chipIcon").innerHTML=svg(IC[veh]);
  $("chipName").textContent=$("name").value.trim()||t["v_"+veh];
  const no=$("num").value.trim().toUpperCase();$("chipNum").textContent=no;$("chipNum").hidden=!no;
}
document.querySelectorAll("#periods button").forEach((b,i)=>b.addEventListener("click",()=>{
  per=i;$("periods").style.setProperty("--idx",i);
  document.querySelectorAll("#periods button").forEach((x,j)=>x.classList.toggle("on",j===i));render(true)}));
document.querySelectorAll("#plats button").forEach((b,i)=>b.addEventListener("click",()=>{
  plat=i;document.querySelectorAll("#plats button").forEach((x,j)=>x.classList.toggle("on",j===i));render(true)}));
function toastF(m){const f=$("ft");f.textContent=m;f.classList.add("show");clearTimeout(fto);fto=setTimeout(()=>f.classList.remove("show"),1800)}
function closeFab(){$("fab").classList.remove("open");$("fam").classList.remove("open")}
function addTrip(){BASE.trips++;BASE.km+=7;BASE.gross+=450;BASE.fees+=59;closeFab();render(true);toastF(T[cur].tripAdded)}
function addExp(){BASE.other+=150;closeFab();render(true);toastF(T[cur].expAdded)}
$("fab").addEventListener("click",e=>{e.stopPropagation();$("fab").classList.toggle("open");$("fam").classList.toggle("open")});
document.addEventListener("click",closeFab);
["qTrip","mTrip"].forEach(i=>$(i).addEventListener("click",addTrip));
["qExp","mExp"].forEach(i=>$(i).addEventListener("click",addExp));
document.querySelectorAll(".nb[data-soon]").forEach(b=>b.addEventListener("click",()=>toastF(T[cur].soon)));
$("theme2").addEventListener("click",()=>$("theme").click());

hero();
let saved=null;
try{saved=localStorage.getItem("lang")}catch(e){}
if(saved&&T[saved]){document.querySelector('input[name="lang"][value="'+saved+'"]').checked=true;apply(saved,false)}else apply("en",false);
